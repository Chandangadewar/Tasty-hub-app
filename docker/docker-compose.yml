services:

  mysql:
    image: mysql:8.0
    container_name: tastyhub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: restaurant_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tastyhub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: chandan240603/tastyhub-backend:latest
    container_name: tastyhub-backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: restaurant_db
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: 5000
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: datadoghq.com
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tastyhub-network

  frontend:
    image: chandan240603/tastyhub-frontend:latest
    container_name: tastyhub-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tastyhub-network

  # ─── Monitoring ───────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: tastyhub-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - tastyhub-network

  grafana:
    image: grafana/grafana:latest
    container_name: tastyhub-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - tastyhub-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: tastyhub-node-exporter
    restart: always
    ports:
      - "9100:9100"
    networks:
      - tastyhub-network

networks:
  tastyhub-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local