

services:

  mysql:
    image: mysql:8.0
    container_name: tastyhub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: restaurant_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tastyhub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: tastyhub-backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: restaurant_db
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: 5000
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: datadoghq.com
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tastyhub-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: tastyhub-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tastyhub-network

  datadog:
    image: datadog/agent:latest
    container_name: tastyhub-datadog
    restart: always
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: datadoghq.com
      DD_APM_ENABLED: "true"
      DD_LOGS_ENABLED: "true"
      DD_CONTAINER_EXCLUDE: "name:tastyhub-datadog"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
    networks:
      - tastyhub-network

networks:
  tastyhub-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local