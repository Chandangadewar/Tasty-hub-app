global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Tasty Hub Backend
  - job_name: 'tastyhub-backend'
    static_configs:
      - targets: ['backend:5000']
    metrics_path: '/metrics'

  # EC2 System Metrics (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']