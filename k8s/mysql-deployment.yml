apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: tastyhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tastyhub-secrets
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              value: restaurant_db
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: mysql-storage
          emptyDir: {}
        - name: mysql-init
          configMap:
            name: mysql-init-sql
            items:
              - key: init.sql
                path: init.sql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: tastyhub
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
